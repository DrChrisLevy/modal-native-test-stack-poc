[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modal-native-test-stack-poc"
version = "0.1.0"
description = "A vibe-coded Modal-native multimodal test-stack proof of concept"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris Levy" }]
dependencies = [
  "modal>=1.5.4,<1.6",
]

[project.optional-dependencies]
remote = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<1",
  "httpx>=0.28,<1",
  "librosa>=0.11,<1",
  "numpy>=2.1,<3",
  "opensearch-py[async]>=3.0,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "safetensors>=0.5,<1",
  "sentence-transformers>=5,<6",
  "soundfile>=0.13,<1",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers>=4.53,<5",
  "uvicorn[standard]>=0.35,<1",
]
test = [
  "coverage[toml]>=7.10,<8",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
]

[project.scripts]
modal-native-test-stack-poc = "modal_native_test_stack_poc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_native_test_stack_poc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "model: executes one or more real Hugging Face models",
  "services: requires real PostgreSQL, Redis, or OpenSearch",
  "e2e: exercises the complete application pipeline",
  "slow: intentionally expensive remote test",
]

[tool.coverage.run]
branch = true
source = ["modal_native_test_stack_poc"]
parallel = true
omit = [
  "*/modal_native_test_stack_poc/cli.py",
  "*/modal_native_test_stack_poc/remote/images.py",
  "*/modal_native_test_stack_poc/remote/models.py",
  "*/modal_native_test_stack_poc/remote/runner.py",
  "*/modal_native_test_stack_poc/remote/seed_worker.py",
  "*/modal_native_test_stack_poc/remote/services.py",
  "*/modal_native_test_stack_poc/remote/session.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
